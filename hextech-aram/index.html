<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>海克斯乱斗快选</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <p class="eyebrow">进游戏前快选</p>
    <h1>海克斯乱斗</h1>
    <p class="lede" id="lede">正在读取本地数据…</p>
  </header>

  <div class="banner" id="stale-banner" hidden></div>

  <section class="panel controls" aria-label="搜索">
    <label class="search">
      <span>英雄或海克斯</span>
      <input id="q" type="search" placeholder="亚索 / ys / jfjh / 亮出你的剑" autocomplete="off" enterkeyhint="search" />
    </label>
    <p class="hint" id="hint"></p>
    <div id="picks" class="picks"></div>
  </section>

  <div id="list" class="list"></div>

  <dialog id="detail">
    <button type="button" id="close" class="close" aria-label="关闭">关闭</button>
    <div id="detail-body"></div>
  </dialog>

  <noscript>需要启用 JavaScript。数据在同一目录的 data.js 里，不访问网络。</noscript>
  <script src="data.js"></script>
  <script src="pinyin.js"></script>
  <script src="app.js"></script>
</body>
</html>
